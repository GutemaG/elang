<style>
    @keyframes gentlePulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.35;
      }
      50% {
        transform: scale(1.35);
        opacity: 1;
      }
    }
    @keyframes floatMascot {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-6px);
      }
    }
    @keyframes subtleGlow {
      0%, 100% {
        transform: scale(1);
        opacity: 0.55;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.85;
      }
    }
    .anim-dot-1 {
      animation: gentlePulse 1.4s ease-in-out infinite 0s;
    }
    .anim-dot-2 {
      animation: gentlePulse 1.4s ease-in-out infinite 0.22s;
    }
    .anim-dot-3 {
      animation: gentlePulse 1.4s ease-in-out infinite 0.44s;
    }
    .anim-mascot {
      animation: floatMascot 3.2s ease-in-out infinite;
    }
    .anim-halo {
      animation: subtleGlow 3.2s ease-in-out infinite;
    }
  </style>

<body class="h-full w-full overflow-hidden select-none bg-surface text-on-background font-body-md antialiased">
<!-- Semantic Shell Filtering Note: TopAppBar and BottomNavBar are strictly suppressed because this is a 0. Splash Screen linear transition state -->
<main class="relative h-full w-full flex flex-col items-center justify-between px-margin-mobile pt-12 pb-10 bg-gradient-to-b from-surface-bright via-surface-container-low to-surface-container-high max-w-md mx-auto">
<!-- Ambient highland warmth background light -->
<div class="pointer-events-none absolute inset-0 flex items-center justify-center overflow-hidden">
<div class="w-80 h-80 rounded-full bg-secondary-fixed opacity-40 blur-3xl anim-halo"></div>
</div>
<!-- Top Counterweight / Safe Area Balancer -->
<div aria-hidden="true" class="w-full h-8 flex-shrink-0"></div>
<!-- Center Content: Mascot with Halo & Wordmark -->
<section class="relative z-10 flex flex-col items-center justify-center my-auto">
<!-- Glow + Mascot Layer -->
<div class="relative flex items-center justify-center mb-space-lg">
<!-- Diffused warm golden/apricot halo -->
<div class="absolute w-44 h-44 rounded-full bg-secondary-container opacity-25 blur-2xl anim-halo pointer-events-none"></div>
<!-- Mascot Container -->
<div class="relative w-36 h-36 md:w-40 md:h-40 rounded-full flex items-center justify-center anim-mascot">
<img alt="Lomi mascot: cheerful Ethiopian ceramic coffee cup character" class="w-full h-full object-contain filter drop-shadow-md" decoding="async" loading="eager" src="https://lh3.googleusercontent.com/aida/AEtjO1XZkAeLg6vcit5NuLrFPBsiHkt8bEq0BW4WasDwn82GRH6DWn9BNGqaLnhG-NDA7KBdKomcO0DLxt75IRJT8AT-4H8wDFDt02YAXJkFpr8bW6C5HRfduuqc2hpDZqo4l1uVebucvQeT8mPugpJ4kdDSXnQ0JJ502ovqZZe3El3oBKKLkJPSvPhi5QT0LlXOeD1v1aWqDaTtIyFg4sETrm0Yz5eTz8CrnSIXYqCTPfo8wsBEjjNny2bE9FA"/>
</div>
</div>
<!-- Brand Wordmark -->
<div class="flex flex-col items-center justify-center">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-background tracking-tight">
          Lomi
        </h1>
</div>
</section>
<!-- Bottom Anchored Minimal Loading Indicator -->
<footer aria-label="Loading Lomi" class="relative z-10 w-full flex flex-col items-center justify-center pb-safe">
<div class="flex items-center justify-center space-x-2.5 h-6">
<span class="w-2.5 h-2.5 rounded-full bg-primary-container anim-dot-1"></span>
<span class="w-2.5 h-2.5 rounded-full bg-primary-container anim-dot-2"></span>
<span class="w-2.5 h-2.5 rounded-full bg-primary-container anim-dot-3"></span>

</footer>
