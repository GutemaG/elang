<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }
    
    /* Tactile 3D Extrusion Shadows */
    .tactile-btn {
      box-shadow: 0 4px 0 #124027;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .tactile-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 transparent;
    }
    
    .tactile-badge {
      box-shadow: 0 3px 0 #e2d7c5;
    }

    /* Ambient Warm Pulse */
    @keyframes softFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1.5deg); }
    }
    .mascot-float {
      animation: softFloat 4s ease-in-out infinite;
    }

    @keyframes steamRise {
      0% { transform: translateY(0) scaleX(1) scaleY(1); opacity: 0; }
      30% { opacity: 0.7; }
      80% { opacity: 0.3; }
      100% { transform: translateY(-24px) scaleX(1.3) scaleY(1.4); opacity: 0; }
    }
    .steam-bubble-1 {
      animation: steamRise 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .steam-bubble-2 {
      animation: steamRise 3.2s cubic-bezier(0.4, 0, 0.2, 1) 0.8s infinite;
    }
    .steam-bubble-3 {
      animation: steamRise 2.5s cubic-bezier(0.4, 0, 0.2, 1) 1.5s infinite;
    }

    /* Coffee Bean bounce loader */
    @keyframes beanPop {
      0%, 80%, 100% { transform: scale(0.85); opacity: 0.45; }
      40% { transform: scale(1.2) translateY(-4px); opacity: 1; }
    }
    .loader-bean-1 { animation: beanPop 1.4s infinite ease-in-out; }
    .loader-bean-2 { animation: beanPop 1.4s infinite ease-in-out 0.2s; }
    .loader-bean-3 { animation: beanPop 1.4s infinite ease-in-out 0.4s; }

    /* Tibeb pattern styling */
    .tibeb-pattern {
      background-image: radial-gradient(#ffa03b 1px, transparent 1px), radial-gradient(#1b5e3b 1px, #fff8f5 1px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      opacity: 0.045;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex items-center justify-center p-0 select-none overflow-x-hidden">
<!-- Mobile Container Shell -->
<div class="relative w-full max-w-lg min-h-screen bg-surface flex flex-col justify-between overflow-hidden shadow-2xl">
<!-- Geometric Cultural Tibeb Backdrop Grid -->
<div class="absolute inset-0 tibeb-pattern pointer-events-none"></div>
<!-- Soft Radiant Sunlight Gradient Spheres -->
<div class="absolute -top-24 -right-24 w-80 h-80 rounded-full bg-secondary-container/15 blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 -left-32 w-72 h-72 rounded-full bg-primary-fixed/30 blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-20 right-1/4 w-96 h-96 rounded-full bg-surface-container-high/60 blur-2xl pointer-events-none"></div>
<!-- Decorative Top Bar Accent (Stylized Habesha Tibeb Ribbon) -->
<div class="w-full pt-space-xs px-margin-mobile flex justify-center items-center z-10">
<div class="flex items-center space-x-1 py-1 px-space-md bg-surface-container-lowest/80 border border-surface-container-highest rounded-full tactile-badge backdrop-blur-sm">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="w-2 h-2 rounded-full bg-secondary-container"></span>
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-label-sm text-label-sm text-secondary tracking-widest pl-1 font-extrabold uppercase">Highland Pulse</span>
</div>
</div>
<!-- Center Hero Section: Mascot & Wordmark -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile py-space-md text-center z-10 relative">
<!-- Mascot Container with 3D Depth & Steam micro-particles -->
<div class="relative w-56 h-56 flex items-center justify-center mb-space-lg">
<!-- Ambient Grounding Shadow -->
<div class="absolute bottom-2 w-36 h-6 bg-inverse-surface/10 rounded-full blur-md"></div>
<!-- Steam Particles rising from Cup -->
<div class="absolute -top-4 flex items-center justify-center space-x-3 pointer-events-none">
<div class="steam-bubble-1 w-3 h-5 rounded-full bg-secondary-container/40 blur-[1px]"></div>
<div class="steam-bubble-2 w-3.5 h-6 rounded-full bg-secondary/30 blur-[1px]"></div>
<div class="steam-bubble-3 w-2.5 h-4 rounded-full bg-secondary-container/50 blur-[1px]"></div>
</div>

<div class="w-full h-10 rounded-2xl bg-surface-container-low border-2 border-surface-container flex items-center justify-center relative overflow-hidden">

</div>
</div>

<span class="w-2 h-2 rotate-45 bg-tertiary rounded-[1px]"></span>
<span class="w-2 h-2 rotate-45 bg-secondary-container rounded-[1px]"></span>
<span class="w-2 h-2 rotate-45 bg-primary rounded-[1px]"></span>
<span class="w-2 h-2 rotate-45 bg-secondary-container rounded-[1px]"></span>
<span class="w-2 h-2 rotate-45 bg-tertiary rounded-[1px]"></span>
</div>
<!-- Mascot Face: Joyful, Expressive Eyes & Cheerful Smile -->
<div class="flex-1 w-full flex flex-col items-center justify-center relative -mt-1">
<!-- Eyes & Cheeks Row -->
<div class="flex items-center justify-between w-24 px-1 mb-1">
<!-- Left Eye (Happy wink / sparkle) -->
<div class="flex flex-col items-center">

<!-- Typography Wordmark Grouping -->

          Buna

</h1>
<!-- Amharic Script Counterpart Badge -->
<div class="inline-flex items-center px-space-md py-0.5 bg-surface-container-low border border-surface-container-high rounded-xl">
<span class="font-headline-sm text-headline-sm text-secondary font-extrabold tracking-wider">ቡና</span>
<span class="mx-space-2xs text-outline-variant font-light">•</span>
<span class="font-label-md text-label-md text-on-surface-variant font-semibold">Coffee &amp; Culture</span>
</div>
<!-- Tagline -->
<p class="font-body-md text-body-md text-on-surface-variant pt-space-xs leading-relaxed font-medium">
          Learn Amharic, One Sip at a Time.
        </p>
</div>
</main>
<!-- Bottom Progress & Tactile Loading Bar State -->
<footer class="w-full px-margin-mobile pb-space-xl pt-space-sm flex flex-col items-center z-10">
<!-- Tactile Card Capsule for Loading -->
<div class="w-full bg-surface-container-lowest border-2 border-surface-container-highest rounded-2xl p-space-md flex flex-col items-center space-y-space-sm tactile-badge">
<!-- Status Indicator Row -->
<div class="w-full flex items-center justify-between">
<div class="flex items-center space-x-2">
<!-- Pulsing 3-Bean Indicator Icons -->
<div class="flex items-center space-x-1 text-secondary">
<span class="material-symbols-outlined loader-bean-1 text-base" style="font-variation-settings: 'FILL' 1;">local_cafe</span>
<span class="material-symbols-outlined loader-bean-2 text-base" style="font-variation-settings: 'FILL' 1;">grain</span>
<span class="material-symbols-outlined loader-bean-3 text-base" style="font-variation-settings: 'FILL' 1;">local_cafe</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-bold">
              Brewing your lessons...
            </span>
</div>
<!-- Progress Percentage Counter -->
<span class="font-label-md text-label-md text-primary font-extrabold bg-primary-fixed/40 text-on-primary-fixed-variant px-space-xs py-0.5 rounded-lg">
            78%
          </span>
</div>
<!-- Tactile 3D Progress Track -->
<div class="w-full h-4 bg-surface-container rounded-full overflow-hidden p-0.5 border border-surface-container-high shadow-inner relative">
<!-- Progress Bar Fill with 3D Bevel Top Sheen -->
<div class="h-full bg-gradient-to-r from-primary-container to-primary rounded-full transition-all duration-700 relative flex items-center justify-end pr-1" style="width: 78%; box-shadow: 0 2px 0 #002110;">
<!-- Little light shimmer point -->
<div class="w-2 h-1.5 rounded-full bg-surface-container-lowest/70"></div>
</div>
</div>
<!-- Micro Helper Tip -->
<p class="font-label-sm text-label-sm text-outline flex items-center space-x-1">
<span class="material-symbols-outlined text-xs">lightbulb</span>
<span>Tip: "Tena Yistillign" means "Health be upon you" (Hello)</span>
</p>
</div>
<!-- Tactile Bottom CTA Preview (Disabled state while brewing) -->
<div class="w-full pt-space-md">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-space-sm px-space-lg rounded-full tactile-btn flex items-center justify-center space-x-2 opacity-95" type="button">
<span>Get Started</span>
<span class="material-symbols-outlined text-base">arrow_forward</span>
</button>
</div>
</footer>
</div>
<!-- Micro Interaction Script for Interactive tactile feedback -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const startBtn = document.querySelector('button');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
          // Playful ripple / click haptic simulation
          startBtn.classList.add('scale-95');
          setTimeout(() => startBtn.classList.remove('scale-95'), 150);
        });
      }
    });
  </script>
</body></html>
